spring.application.name=calendar-app

# PostgreSQL connection. DB_HOST/DB_PORT/DB_NAME have sensible local defaults;
# DB_USER/DB_PASSWORD must always be supplied via environment variables (see .env.example).
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:calendarapp}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# Flyway owns the schema. Hibernate must only validate that entities match
# the tables Flyway created — it must never create/alter tables itself.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# Avoid lazy-loading access outside a transaction leaking through the web layer later.
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Swagger UI: http://localhost:8080/swagger-ui.html
# OpenAPI JSON: http://localhost:8080/v3/api-docs
